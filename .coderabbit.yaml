# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
early_access: false
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false
  in_progress_fortune: false
  suggested_labels: false
  suggested_reviewers: false
  path_filters:
    - "!Cargo.lock"
    - "!target/**"
    - "!coverage/**"
  path_instructions:
    - path: "src/**/*.rs"
      instructions: |
        Public items need rustdoc covering the contract: purpose, invariants,
        errors, panics, and an example where it helps. Inline `//` comments are
        only warranted for a why the code cannot state (a workaround and its
        reason, a drop-order dependency, a deliberate fail-closed choice).
        Flag inline comments that restate what the code does or describe a
        dependency's internals.

        Anything behind the `dev` feature must stay feature-gated, and
        libc usage must stay cfg(unix)-gated so non-Unix `dev` builds compile.
        Do not suggest adding dependencies to a library crate without a
        concrete reason; new deps are a cost to every downstream user.

        Formatting is rustfmt with tab_spaces = 2. Do not comment on style
        that `cargo fmt` or `cargo clippy -- -D warnings` already enforces.
    - path: "tests/**/*.rs"
      instructions: |
        Check that tests assert behavior rather than restating the
        implementation, and that new public API or bugfixes come with
        coverage. Both feature configurations matter: default and
        `--all-features`.
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    # Stacked PRs target the branch below them, not just master.
    base_branches:
      - ".*"
  tools:
    clippy:
      enabled: true
    actionlint:
      enabled: true
    yamllint:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true

chat:
  art: false
  auto_reply: true
  allow_non_org_members: false

knowledge_base:
  learnings:
    scope: local
  issues:
    scope: local
