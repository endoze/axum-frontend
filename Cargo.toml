[package]
name = "axum-frontend"
version = "0.1.0"
edition = "2021"
description = "Serve a Vite frontend from axum: embed the built SPA in the binary, serve it from a directory, or spawn and reverse-proxy the dev server."
authors = ["Endoze <endoze@endozemedia.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/endoze/axum-frontend"
documentation = "https://docs.rs/axum-frontend"
homepage = "https://github.com/endoze/axum-frontend"
rust-version = "1.85.0"
keywords = ["axum", "vite", "frontend", "spa", "embed"]
categories = ["web-programming", "web-programming::http-server", "development-tools"]

[features]
default = []
dev = ["dep:axum-reverse-proxy", "dep:tokio", "dep:libc"]

[dependencies]
axum = "0.8"
tower = "0.5"
# default-features = false drops the `tls` feature (hyper-rustls). We only ever
# proxy to a local http Vite server, so TLS is unnecessary — and pulling
# hyper-rustls adds a second rustls crypto backend (aws-lc-rs) alongside the
# workspace's ring (sea-orm/reqwest), which makes rustls panic ("could not
# determine CryptoProvider") on the first proxied request.
axum-reverse-proxy = { version = "1.3", default-features = false, optional = true }
rust-embed = { version = "8", features = ["mime-guess"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1", features = ["process", "net", "time"], optional = true }
# Unix-only in practice: used to SIGKILL the dev server's whole process group on
# drop (see src/dev.rs). Only pulled in under the `dev` feature; all usage is
# cfg(unix)-gated, so non-Unix `dev` builds compile without touching it.
libc = { version = "0.2", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "time"] }
tower = { version = "0.5", features = ["util"] }

# Opt this library in to dist (announce-only; no binaries to build)
[package.metadata.dist]
dist = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
